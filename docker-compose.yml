services:
  mlflow:
    build: .
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - ./runtime/mlflow:/mlflow

  reproducibility-tools:
    build: .
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    command: ["sleep", "infinity"]
    volumes:
      - .:/portal:ro
    depends_on:
      - mlflow
